<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Kurrent architecture: control plane, storager node and stateless devices">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #000; }
    .panel { fill: #fff; stroke: #000; stroke-width: 1; }
    .bar { fill: #f4f4f4; stroke: #000; stroke-width: 1; }
    .box { fill: #fff; stroke: #000; stroke-width: 1; }
    .t { font-size: 15px; font-weight: 600; letter-spacing: 0.5px; }
    .h { font-size: 13px; font-weight: 600; }
    .b { font-size: 10px; fill: #555; }
    .a { stroke: #000; stroke-width: 1.2; fill: none; }
    .ad { stroke: #000; stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
    .lbl { font-size: 10px; }
    .cap { font-size: 11px; fill: #555; }
  </style>

  <!-- ==================== CONTROLLER NODE ==================== -->
  <rect class="panel" x="60" y="40" width="1080" height="190" />
  <rect class="bar" x="60" y="40" width="1080" height="26" />
  <text class="t" x="76" y="58">CONTROLLER NODE</text>

  <rect class="box" x="90" y="80" width="190" height="120" />
  <text class="h" x="102" y="100">CLI · WEBUI</text>
  <text class="b" x="102" y="118">HTTPS clients</text>
  <text class="b" x="102" y="134">kurrent config print</text>
  <text class="b" x="102" y="148">  → init</text>
  <text class="b" x="102" y="162">  → token create</text>
  <text class="b" x="102" y="176">  → join</text>

  <rect class="box" x="310" y="80" width="230" height="120" />
  <text class="h" x="322" y="100">NGINX  :443</text>
  <text class="b" x="322" y="118">sole external entry</text>
  <text class="b" x="322" y="134">:80 → 301 upgrade</text>
  <text class="b" x="322" y="150">/api/cp/  /devices/*</text>
  <text class="b" x="322" y="164">/boot-vars  /file/  /tftp/</text>
  <text class="b" x="322" y="178">WebUI SPA</text>

  <rect class="box" x="570" y="80" width="280" height="120" />
  <text class="h" x="582" y="100">CONTROL PLANE  :4839</text>
  <text class="b" x="582" y="118">loopback only (127.0.0.1)</text>
  <text class="b" x="582" y="134">ledgers · device pool · binding</text>
  <text class="b" x="582" y="150">disk scheduling · boot-vars projection</text>
  <text class="b" x="582" y="166">internal CA / PKI · audit</text>
  <text class="b" x="582" y="182">state = plain YAML / JSONL files</text>

  <rect class="box" x="880" y="80" width="230" height="120" />
  <text class="h" x="892" y="100">DNSMASQ  (host net)</text>
  <text class="b" x="892" y="118">DHCP :67 · TFTP :69</text>
  <text class="b" x="892" y="134">PXE boot files</text>
  <text class="b" x="892" y="150">mac,hostname bindings</text>
  <text class="b" x="892" y="166">(projection of the device ledger)</text>

  <path class="a" d="M 280 140 H 306" />
  <path class="a" d="M 310 140 l -6 -4 v 8 z" fill="#000" stroke="none" />
  <path class="a" d="M 540 140 H 566" />
  <path class="a" d="M 570 140 l -6 -4 v 8 z" fill="#000" stroke="none" />

  <!-- ==================== STORAGER NODE ==================== -->
  <rect class="panel" x="620" y="290" width="520" height="180" />
  <rect class="bar" x="620" y="290" width="520" height="26" />
  <text class="t" x="636" y="308">STORAGER NODE</text>

  <rect class="box" x="650" y="330" width="150" height="120" />
  <text class="h" x="662" y="350">AGENT  :4840</text>
  <text class="b" x="662" y="368">mTLS</text>
  <text class="b" x="662" y="384">disk lifecycle</text>
  <text class="b" x="662" y="400">master scan</text>
  <text class="b" x="662" y="416">reflink clone</text>

  <rect class="box" x="830" y="330" width="170" height="120" />
  <text class="h" x="842" y="350">NVMET-HOST</text>
  <text class="h" x="842" y="366">  :4841</text>
  <text class="b" x="842" y="384">host network, mTLS</text>
  <text class="b" x="842" y="400">configfs: subsystem /</text>
  <text class="b" x="842" y="416">namespace / port / hosts</text>
  <text class="b" x="842" y="432">+ dhchap_key</text>

  <rect class="box" x="1030" y="330" width="110" height="120" />
  <text class="h" x="1042" y="350">DISK</text>
  <text class="h" x="1042" y="366">IMAGES</text>
  <text class="b" x="1042" y="384">master</text>
  <text class="b" x="1042" y="398">_tpl_</text>
  <text class="b" x="1042" y="416">reflink</text>
  <text class="b" x="1042" y="430">clones</text>

  <path class="a" d="M 800 390 H 826" />
  <path class="a" d="M 830 390 l -6 -4 v 8 z" fill="#000" stroke="none" />
  <path class="ad" d="M 1000 390 H 1026" />

  <!-- ==================== KEY POINTS ==================== -->
  <rect class="panel" x="250" y="290" width="260" height="180" />
  <rect class="bar" x="250" y="290" width="260" height="26" />
  <text class="t" x="266" y="308">KEY POINTS</text>
  <text class="b" x="266" y="334">· TOFU single anchor: the server</text>
  <text class="b" x="266" y="347">  cert fingerprint is pinned in</text>
  <text class="b" x="266" y="360">  device NVRAM</text>
  <text class="b" x="266" y="379">· Device identity: ECDSA P-256</text>
  <text class="b" x="266" y="392">  key born in NVRAM, signed at</text>
  <text class="b" x="266" y="405">  boot (challenge / response)</text>
  <text class="b" x="266" y="424">· DH-HMAC-CHAP = connection</text>
  <text class="b" x="266" y="437">  control only; NVMe/TCP TLS</text>
  <text class="b" x="266" y="450">  (tsas) not implemented yet</text>

  <!-- ==================== DEVICES ==================== -->
  <rect class="panel" x="60" y="530" width="1080" height="190" />
  <rect class="bar" x="60" y="530" width="1080" height="26" />
  <text class="t" x="76" y="548">DEVICES  —  stateless compute</text>

  <rect class="box" x="90" y="570" width="280" height="120" />
  <text class="h" x="102" y="590">worker-01</text>
  <text class="b" x="102" y="610">no local disk</text>
  <text class="b" x="102" y="626">PXE boot</text>
  <text class="b" x="102" y="642">NVRAM identity</text>
  <text class="b" x="102" y="658">NVMe-oF root</text>
  <text class="b" x="102" y="678">disk NQN … .debian.&lt;os_tag&gt;</text>

  <rect class="box" x="420" y="570" width="280" height="120" />
  <text class="h" x="432" y="590">worker-02</text>
  <text class="b" x="432" y="610">no local disk</text>
  <text class="b" x="432" y="626">PXE boot</text>
  <text class="b" x="432" y="642">NVRAM identity</text>
  <text class="b" x="432" y="658">NVMe-oF root</text>
  <text class="b" x="432" y="678">disk NQN … .ubuntu.&lt;os_tag&gt;</text>

  <rect class="box" x="750" y="570" width="280" height="120" />
  <text class="h" x="762" y="590">worker-03</text>
  <text class="b" x="762" y="610">no local disk</text>
  <text class="b" x="762" y="626">PXE boot</text>
  <text class="b" x="762" y="642">NVRAM identity</text>
  <text class="b" x="762" y="658">NVMe-oF root</text>
  <text class="b" x="762" y="678">disk NQN … .centos.&lt;os_tag&gt;</text>

  <!-- management: control plane -> storager agent -->
  <path class="a" d="M 700 200 V 286" />
  <path class="a" d="M 700 290 l -4 -6 h 8 z" fill="#000" stroke="none" />
  <text class="lbl" x="710" y="250">HTTPS mTLS :4840</text>

  <!-- data plane: devices -> storager (bypasses the control plane) -->
  <path class="a" d="M 960 530 V 474" />
  <path class="a" d="M 960 470 l -4 6 h 8 z" fill="#000" stroke="none" />
  <text class="lbl" x="700" y="498">NVMe/TCP :4420 — data plane</text>
  <text class="lbl" x="700" y="512">never through the control plane</text>

  <!-- boot chain: devices -> nginx :443 -->
  <path class="a" d="M 560 530 V 234" />
  <path class="a" d="M 560 230 l -4 6 h 8 z" fill="#000" stroke="none" />
  <text class="lbl" transform="rotate(-90 552 380)" x="552" y="380" text-anchor="middle">HTTPS :443 · boot chain</text>

  <!-- PXE: dnsmasq -> devices -->
  <path class="a" d="M 1080 200 C 1180 250, 1180 470, 1080 530" />
  <path class="a" d="M 1080 530 l 4 -7 h -8 z" fill="#000" stroke="none" />
  <text class="lbl" transform="rotate(-90 1170 380)" x="1170" y="380" text-anchor="middle">DHCP · TFTP</text>

  <!-- ==================== CAPTION ==================== -->
  <text class="cap" x="60" y="736">Boot flow:  PXE → /devices/report (fingerprint + pubkey) → /devices/challenge (nonce, sign) → /boot-vars (4 gates)</text>
  <text class="cap" x="60" y="752">            → nvme://storager:4420/disk-NQN → initramfs consumes NBFT + NBCT → rootfs</text>
  <text class="cap" x="60" y="770">Every path except the NVMe/TCP data plane goes through nginx :443, the sole external entry; state lives in plain files under control_plane/state/.</text>
  <text class="cap" x="60" y="788">Solid: control / management.  Dashed: projection (the host serves disk images to the data plane).</text>
</svg>
