# NVMe-oF 后端独立编排：内核 nvmet target 在宿主，管理服务容器 kurrent-nvmet-host；与 iscsi/ 互斥。
# 部署：cd storager/nvmeof && docker compose --env-file ../.env up -d
# 前置（宿主）：sudo bash host-prepare.sh（nvmet/nvmet-tcp 模块 + configfs 挂载 + 重启持久化，见 nvmet-host/README.md）
# 本文件为完整编排：含共享 Agent 服务（代码在 storager/agent/，配置来源：../kurrent.yaml，
# 节点声明式配置；.env 仅保留 compose 插值键）。
# 注：nvmet 后端由 Agent 经 HTTP 驱动 nvmet-host，不需要 docker.sock（最小权限）；
# iscsi 后端仍按 storager/iscsi/docker-compose.yml 挂载以 exec 后端容器。

services:
  # ── 存储节点 Agent（控制面数据面接口）──
  # nvmet 后端不挂 docker.sock：Agent 仅经 HTTPS 调 nvmet-host，容器逃逸面不含宿主 root
  storager-agent:
    build:
      context: ../agent
      dockerfile: Dockerfile
    image: storager-agent
    container_name: storager-agent
    restart: unless-stopped
    ports:
      - "4840:8080"                    # 控制面 HTTPS（mTLS），给 Controller
    extra_hosts:
      - "host.docker.internal:host-gateway"   # nvmet-host 为 host 网络模式，经宿主 loopback 访问其 4841
    volumes:
      - /etc/localtime:/etc/localtime:ro
      # 盘镜像目录：宿主路径经 KURRENT_DISK_DIR 插值（kurrent.yaml spec.agent.diskDir 权威，join 同步到 .env）
      - ${KURRENT_DISK_DIR:-../../storager_img}:/home/iscsi_img
      - ../agent/logs:/var/log/kurrent
      # 组件 PKI：本组件证书目录（可写，引导/轮换时落盘）；
      # 宿主路径可用 KURRENT_AGENT_PKI_HOST 覆盖（kurrent join 按 agent_id 写入）
      - ${KURRENT_AGENT_PKI_HOST:-../../control_plane/state/pki/components/agent-storage-lio-01}:/etc/kurrent/pki
      # 控制面 nginx 服务器证书（自签，作为 enroll/renew 的 TOFU 信任根）
      - ../../control_plane/state/certs/server.crt:/etc/kurrent/cp-ca.crt:ro
      # 节点声明式配置：agent/nvmet-host 挂载同一份只读配置
      - ../kurrent.yaml:/etc/kurrent/kurrent.yaml:ro
      # 引导凭据目录（可写）：agent.token 由 kurrent join 写入；
      # nvmet-host.token 为本组件 enroll 按能力派生后落盘（nvmet-host 容器只读共享）
      - ../bootstrap:/etc/kurrent/bootstrap

  # ── NVMe-oF 宿主管理服务（声明 spec.agent.backend=nvmet 时启用）──
  # 内核 nvmet target 在宿主（模块/configfs 由 host-prepare.sh 就位，见 nvmet-host README）；
  # 本容器只承载配置面管理进程：bind mount configfs 后普通 root 即可写入，无需 privileged。
  # host 网络模式：nvmet 监听 socket 由写 configfs 的进程（本容器）创建，绑定到该进程所在
  # 网络命名空间；host 模式下即宿主 netns，客户端（iPXE/QEMU）可直达数据面端口 4421，容器重建不丢监听。
  # Agent 经 https://host.docker.internal:4841 访问本服务（mTLS）；该地址是部署事实常量
  # （storager/agent/app/config.py DEFAULT_NVMET_HOST_URL），不在节点声明里——声明出现
  # spec.agent.nvmetHostUrl 会被拒（分层职责：容器内路径/内部通讯归 compose）。
  nvmet-host:
    build:
      context: ./nvmet-host
      dockerfile: Dockerfile
    image: kurrent-nvmet-host
    container_name: kurrent-nvmet-host
    restart: unless-stopped
    network_mode: host
    # 健康检查：mTLS 探活 /healthz（带本组件 client cert；configfs 就绪才报健康）——
    # 宿主前置缺失（模块/configfs）时如实标记 unhealthy，不再是「容器在跑但数据面不可用」
    healthcheck:
      test: ["CMD", "python3", "-c", "import json,ssl,urllib.request as u; c=ssl.create_default_context(cafile='/etc/kurrent/pki/ca-nodes.crt'); c.load_cert_chain('/etc/kurrent/pki/client.crt','/etc/kurrent/pki/client.key'); raise SystemExit(0 if json.load(u.urlopen('https://127.0.0.1:4841/healthz', context=c, timeout=3)).get('configfs') else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # host 网络下无 Docker 注入的 host.docker.internal 解析：显式指到宿主 loopback，
    # 使同一份 kurrent.yaml 的 spec.controlPlane.url 对两组件语义一致（nginx 443 在宿主）
    extra_hosts:
      - "host.docker.internal:127.0.0.1"
    # Ubuntu docker-default AppArmor profile 会拒绝 configfs 写入（Permission denied），
    # 本容器需写 /sys/kernel/config 管理 nvmet，故豁免 AppArmor；
    # 生产环境建议改用自定义 profile 仅放行 configfs（见 nvmet-host/README.md）。
    security_opt:
      - apparmor:unconfined
      # TLS-PSK 目标端供给（内核段加密，见 blueprint/nvme-tcp-tls-in-kernel.md）：
      # 本服务需把 psk key 注入内核全局 .nvme keyring —— 默认策略下两处被挡，
      # 缺任何一条都会静默失败（详见 nvmet-host/app/main.py 的 NvmePskKeyring）：
      #   seccomp：默认策略拒 add_key/keyctl 内核 syscall（EPERM）
      #   systempaths：/proc/keys 被默认 MaskedPaths 屏蔽成 /dev/null（拿不到 keyring serial）
      - seccomp=unconfined
      - systempaths=unconfined
    volumes:
      - /sys/kernel/config:/sys/kernel/config
      # 磁盘镜像目录：configfs device_path 由写入进程（本容器）所在挂载命名空间解析，
      # 须让本容器能看见盘文件（与 agent 的 KURRENT_DISK_DIR 一致，容器内路径可不同）
      - ${KURRENT_DISK_DIR:-../../storager_img}:/srv/nvmet-disks
      - /etc/localtime:/etc/localtime:ro
      # 组件 PKI：nvmet-host 独立组件身份（cn=nvmet-<agent_id>）；
      # 宿主路径可用 KURRENT_NVMET_PKI_HOST 覆盖（kurrent join 按 agent_id 写入）
      - ${KURRENT_NVMET_PKI_HOST:-../../control_plane/state/pki/components/nvmet-storage-lio-01}:/etc/kurrent/pki
      - ../../control_plane/state/certs/server.crt:/etc/kurrent/cp-ca.crt:ro
      # 节点声明式配置：与 agent 挂载同一份只读配置
      - ../kurrent.yaml:/etc/kurrent/kurrent.yaml:ro
      # 引导凭据目录（只读共享）：nvmet-host.token 由 agent enroll 按能力派生写入，
      # 本组件引导时读取
      - ../bootstrap:/etc/kurrent/bootstrap:ro
