#!ipxe

# 同机部署：tftp/dnsmasq/nginx/control-plane 都在同一台服务器上，next-server 即控制面 IP
set controller_ip ${next-server}

# HTTPS 引导入口（nginx 443，TOFU 自签证书）：TOFU 单锚——全部 HTTPS 目标共享同一证书
# 端口可配置：与 docker-compose 的 KURRENT_HTTPS_PORT、boot.ipxe 的 set https-port 保持一致
# （改端口需三处同步）
set https-port 443
set https-url https://${controller_ip}:${https-port}/

# URL used when sanbooting：引导脚本已全部走 HTTPS，不再从 TFTP 解析相对路径
set chain-url ${https-url}file

# REQUIRED: Absolute URL to the menu script, used by boot.ipxe
# T5：menu 走 HTTPS（nginx /tftp/，与引导脚本同一目录）——TOFU 单锚下同一证书
set menu-url ${https-url}tftp/menu.ipxe

# OPTIONAL: data-plane (storage) server location and iSCSI IQNs
# Must be specified as an IP, some clients have issues with name resolution
# Initiator IQN is also calculated to use hostname, if present
# C3：数据面地址变量更名 storager-ip（协议中立：NVMe-oF 引导 + iSCSI 安装器共用）
set storager-ip ${controller_ip}
set base-iqn iqn.2026-07.com.controller
# iSCSI root 连接符默认 stgt 格式；/boot-vars 按后端类型（stgt `:::1:` / LIO `::::`）下发 iscsi-sep 覆盖
set iscsi-sep :::1:
isset ${hostname} && set initiator-iqn ${base-iqn}:${hostname} || set initiator-iqn ${base-iqn}:${mac}

# OPTIONAL: URL to report memtest results to
set memtest-report-url http://boot.smidsrod.lan/memtest-report.cgi

# ══════════════════════════════════════════════════════════════════
# 设备信任根链（T5，需固件含 0006/0007/0008 能力：NVS 持久化 + HTTPS/TOFU + keygen/pubkey/sign）
# 明文引导面只剩 TFTP 上的 snponly.efi 与 boot.ipxe 指针；
# 本文件与 menu.ipxe 均经 HTTPS（nginx 443，TOFU 信任锚）取回。
# ──────────────────────────────────────────────────────────────────
# 阶段 1：设备身份（R4，幂等）——首次生成 ECDSA P-256 私钥（NVRAM 持久化），
# 之后 keygen 拒绝覆盖并退出非零，|| 容忍；旧固件无此命令 → 失败跳过
keygen || echo "identity: already provisioned"

# 阶段 2：公钥导出与上报（R6，注册/认领）——pubkey 写入 ${pubkey}（内存设置）；
# report 返回空响应无脚本副作用；窗口开启 + 有效公钥 → 入池/认领（key_hash 填充）
pubkey || goto report-done
chain --autofree ${https-url}devices/report?mac=${netX/mac}&uuid=${uuid}&manufacturer=${manufacturer}&product=${product}&serial=${serial}&cpumodel=${cpumodel}&mem-total=${mem-total}&mem-type=${mem-type}&mem-speed=${mem-speed}&chip=${netX/chip}&busid=${netX/busid}&pubkey=${pubkey} ||
:report-done

# 阶段 3：挑战-响应（R7，验签取凭据）
# challenge 失败（未注册/未认领 404、旧固件无 HTTPS）→ 降级不带 nonce/sig 请求：
#   过渡期（验签强制关）只下发菜单变量，凭据不注入；强制开启后由控制面拒绝（no_key/missing_sig）
:challenge
chain --autofree ${https-url}devices/challenge?mac=${mac} && goto signed || goto bootvars

:signed
sign ${nonce}${mac} || goto bootvars
chain --autofree ${https-url}boot-vars?mac=${mac}&hostname=${hostname}&nonce=${nonce}&sig=${sig} || goto vars-done
goto vars-done

# 阶段 3 降级路径：无 nonce/sig 直接请求（凭据一律不下发；是否整体放行由验签强制开关决定）
:bootvars
chain --autofree ${https-url}boot-vars?mac=${mac}&hostname=${hostname} || goto vars-done

# Rebuild derived values after per-worker variables override storager-ip.
# isset 守卫：/boot-vars 已下发按后端生成的 iscsi-sep（stgt `:::1:` / LIO `::::`）时不覆盖
:vars-done
isset ${iscsi-sep} || set iscsi-sep :::1:
isset ${hostname} && set initiator-iqn ${base-iqn}:${hostname} || set initiator-iqn ${base-iqn}:${mac}
