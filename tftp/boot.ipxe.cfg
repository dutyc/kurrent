#!ipxe

# 同机部署：tftp/dnsmasq/nginx/control-plane 都在同一台服务器上，next-server 即控制面 IP
set controller_ip ${next-server}

# HTTPS 引导入口（nginx 443，TOFU 自签证书）：TOFU 单锚——全部 HTTPS 目标共享同一证书
# 端口可配置：与 docker-compose 的 KURRENT_HTTPS_PORT、boot.ipxe 的 set https-port 保持一致
# （改端口需三处同步）
set https-port 443
set https-url https://${controller_ip}:${https-port}/

# REQUIRED: Absolute URL to the menu script, used by boot.ipxe
# T5：menu 走 HTTPS（nginx /tftp/，与引导脚本同一目录）——TOFU 单锚下同一证书
set menu-url ${https-url}tftp/menu.ipxe

# OPTIONAL: data-plane (storage) server location and iSCSI IQNs
# Must be specified as an IP, some clients have issues with name resolution
# Initiator IQN is also calculated to use hostname, if present
set storager-ip ${controller_ip}
set base-iqn iqn.2026-07.com.controller
# iSCSI root 连接符默认 stgt 格式；/boot-vars 按后端类型（stgt `:::1:` / LIO `::::`）下发 iscsi-sep 覆盖
set iscsi-sep :::1:
isset ${hostname} && set initiator-iqn ${base-iqn}:${hostname} || set initiator-iqn ${base-iqn}:${mac}

# ══════════════════════════════════════════════════════════════════
# 设备信任根链（TPM 2.0 AK + PCR quote，需固件含 0006/0007 与 TPM 身份命令：
# NVS 持久化 + HTTPS/TOFU + akgen/akpub/quote）
# 明文引导面只剩 TFTP 上的 snponly.efi 与 boot.ipxe 指针；
# 本文件与 menu.ipxe 均经 HTTPS（nginx 443，TOFU 信任锚）取回。
# ──────────────────────────────────────────────────────────────────
# 阶段 1：设备身份（幂等）——首次在 TPM 内创建 AK 并持久化到 NV；
# 已存在时复用，不覆盖。无 TPM 时命令失败，后续拿不到 AK 与 quote。
akgen || echo "identity: TPM AK unavailable"

# 阶段 2：AK 公钥与 Secure Boot 状态导出后上报（注册/认领）。
# report 返回空响应无脚本副作用；窗口开启 + 有效 AK + sb=1 → 入池/认领
akpub || goto report-fingerprint
chain --autofree ${https-url}devices/report?mac=${netX/mac}&uuid=${uuid}&manufacturer=${manufacturer}&product=${product}&serial=${serial}&cpumodel=${cpumodel}&mem-total=${mem-total}&mem-type=${mem-type}&mem-speed=${mem-speed}&chip=${netX/chip}&busid=${netX/busid}&ak_public=${ak-public}&ak_name=${ak-name}&ak_type=${ak-type}&sb=${sb} ||
goto report-done

# 无 TPM：不带 AK 上报，控制面记为 no_tpm 并拒绝入池（指纹仍合并）
:report-fingerprint
chain --autofree ${https-url}devices/report?mac=${netX/mac}&uuid=${uuid}&manufacturer=${manufacturer}&product=${product}&serial=${serial}&cpumodel=${cpumodel}&mem-total=${mem-total}&mem-type=${mem-type}&mem-speed=${mem-speed}&chip=${netX/chip}&busid=${netX/busid}&sb=${sb} ||

:report-done

# 阶段 3：挑战-证明（取凭据）
# challenge 失败（未注册/未认领 404、旧固件无 HTTPS）→ 降级不带证明请求：
#   过渡期（证明强制关）只下发菜单变量，凭据不注入；强制开启后由控制面拒绝
:challenge
chain --autofree ${https-url}devices/challenge?mac=${mac} && goto quoted || goto bootvars

:quoted
quote ${nonce} || goto bootvars
chain --autofree ${https-url}boot-vars?mac=${mac}&hostname=${hostname}&nonce=${nonce}&quote=${quote}&quote_sig=${quote-sig} || goto retry-vars
goto vars-done

# 认证或 TLS 握手失败时重取一次（凭据轮换边界），最多一次
:retry-vars
chain --autofree ${https-url}boot-vars?mac=${mac}&hostname=${hostname}&nonce=${nonce}&quote=${quote}&quote_sig=${quote-sig} || goto vars-done
goto vars-done

# 阶段 3 降级路径：无 nonce/quote 直接请求（凭据一律不下发；是否整体放行由证明强制开关决定）
:bootvars
chain --autofree ${https-url}boot-vars?mac=${mac}&hostname=${hostname} || goto vars-done

# Rebuild derived values after per-worker variables override storager-ip.
# isset 守卫：/boot-vars 已下发按后端生成的 iscsi-sep（stgt `:::1:` / LIO `::::`）时不覆盖
:vars-done
isset ${iscsi-sep} || set iscsi-sep :::1:
isset ${hostname} && set initiator-iqn ${base-iqn}:${hostname} || set initiator-iqn ${base-iqn}:${mac}
