services:

  # ── DHCP / TFTP / 引导文件服务 ──
  # 全链路 host 网络直通：DHCP 应答、iPXE 脚本（tftp/ 挂载）、TFTP 引导文件
  kurrent-dnsmasq:
    build:
      context: ./dnsmasq
      dockerfile: Dockerfile
      # BuildKit 默认桥接网络取不到 Alpine 仓库；host 网络只用于构建阶段
      network: host
    image: kurrent-dnsmasq
    container_name: kurrent-dnsmasq
    network_mode: host
    cap_add:
      - NET_ADMIN
    volumes:
      - ./dnsmasq/dnsmasq.conf:/etc/dnsmasq.conf
      - ./dnsmasq/dhcp-hosts.conf:/etc/dnsmasq.d/dhcp-hosts.conf
      - ./dnsmasq/dnsmasq.leases:/var/lib/misc/dnsmasq.leases
      - /etc/localtime:/etc/localtime:ro
      - ./tftp:/var/tftp:ro
    restart: unless-stopped
    command: ["--no-daemon", "--log-queries", "--log-dhcp"]    

  # ── 控制面（Control Plane）──
  # Worker 生命周期编排 / Agent 调度 / 台账 / dnsmasq 绑定 / 启动变量投影
  # 配置来源：control_plane/kurrent.yaml（从 kurrent.yaml.example 复制后修改，声明式权威）
  kurrent-control-plane:
    build:
      context: ./control_plane
      dockerfile: Dockerfile
    image: kurrent-control-plane
    container_name: kurrent-control-plane
    restart: unless-stopped
    # 管理面不发布 TCP 端口：nginx 经共享卷中的 unix socket 访问（见 volumes）。
    # 宿主 4839 已移除，健康检查在容器内经同一 socket 完成。
    environment:
      # 容器时区（日志时间戳）
      - TZ=Asia/Shanghai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # 管理面唯一通道：控制面监听 cp.sock，nginx 是唯一挂载该卷的对端。
      # reload 哨兵（nginx.reload/nginx.ack）也走该卷：控制面不持任何容器运行时权限。
      - kurrent-run:/run/kurrent
      # 声明式配置（只读）：spec.networking 是 dnsmasq.conf 的权威来源
      - ./control_plane/kurrent.yaml:/etc/kurrent/kurrent.yaml:ro
      - ./control_plane/config:/app/config
      - ./control_plane/state:/app/state
      - /etc/localtime:/etc/localtime:ro
      # dnsmasq 目录（可写）：dnsmasq.conf 由控制面启动时按 spec.networking 生成，dnsmasq 容器挂载同文件
      - ./dnsmasq:/app/dnsmasq
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ── Web 管理界面 + 文件浏览（nginx）──
  # 静态资源由 webui/app 构建产物挂载；public/ 为 iPXE 公开文件（ISO/kernel/initrd）
  kurrent-nginx:
    build:
      context: ./webui/deploy
      dockerfile: Dockerfile
    container_name: kurrent-webui
    ports:
      # 宿主 HTTPS 入口端口可配（默认 443）：改这里时需同步 tftp/boot.ipxe.cfg 的 set https-port
      # HTTP（80）仅作 301 升级到 443（不承载任何内容/凭据）；WebUI 不再单独映射端口
      - "80:80"
      - "${KURRENT_HTTPS_PORT:-443}:443"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      # ── Web UI 静态文件 (cd app && npm run build) ──
      - ./webui/app/dist:/usr/share/nginx/html:ro
      # ── iPXE 公开文件目录: ISO, kernel, initrd (被浏览和下载的数据) ──
      - ./webui/deploy/public:/data:ro
      # ── TOFU 自签证书（控制面启动时自动生成到 state/certs，私钥不入库；nginx 只读挂载）──
      - ./control_plane/state/certs:/etc/nginx/certs:ro
      # ── 客户端证书信任包（ca-users + ca-nodes）：只挂信任包目录 ──
      # 不挂整个 pki 目录：ca.key 与用户私钥不得出现在面向前端的容器文件系统里。
      - ./control_plane/state/pki/nginx:/etc/nginx/pki:ro
      # 管理面 unix socket 所在卷（控制面与 nginx 共享；无 TCP 监听）
      - kurrent-run:/run/kurrent
      # ── iPXE 菜单/覆盖脚本 HTTPS 同源 (与 dnsmasq TFTP 同一目录) ──
      - ./tftp:/tftp:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  # 管理面 unix socket 的载体：只有控制面与 nginx 挂载，构成唯一写入边界。
  kurrent-run: