proxy_set_header X-Client-Cert-DN $valid_client_dn;
proxy_set_header X-Client-Cert-Issuer $valid_client_issuer;
proxy_set_header X-Client-Cert-Serial $valid_client_serial;
proxy_set_header X-Client-Cert-Fingerprint $valid_client_fp;
proxy_set_header X-Client-Class $valid_client_class;
proxy_set_header X-Client-Cert-Verify $ssl_client_verify;
# 校验失败时 nginx 不注入 issuer（valid_* 为空）；原始 issuer 仅用于审计取证，
# 不参与身份判断。客户端自带的同名头已由 server 级空值 + 本指令覆盖。
proxy_set_header X-Client-Cert-Raw-Issuer $ssl_client_i_dn;
