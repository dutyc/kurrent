worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;
    # 不回显版本号（减少指纹信息；版本仍可从镜像标签获取）
    server_tokens off;

    # upstream ── 管理面只经共享卷中的 unix socket 访问；控制面不监听 TCP，
    # 同网容器与 host 网络进程都无法直连。身份头只可能由本进程写入。
    upstream control_plane {
        server unix:/run/kurrent/cp.sock;
    }

    # 客户端证书证据：仅在链校验通过（SUCCESS）时取值（防无效证书伪造身份头）
    map $ssl_client_verify $valid_client_dn {
        "SUCCESS" $ssl_client_s_dn;
        default   "";
    }
    map $ssl_client_verify $valid_client_issuer {
        "SUCCESS" $ssl_client_i_dn;
        default   "";
    }
    map $ssl_client_verify $valid_client_serial {
        "SUCCESS" $ssl_client_serial;
        default   "";
    }
    map $ssl_client_verify $valid_client_fp {
        "SUCCESS" $ssl_client_fingerprint;
        default   "";
    }

    # 主体类由已校验证书的 issuer 决定（users/nodes 两个域进 443）：
    # 不解析 DN 语义，组件证书无法通过自报字段变成 human。
    # 末行兼容遗留单 CA（CN=kurrent-ca，启动时原位提升为 nodes 域）：存量组件证书
    # 继续有效；renew 仍由该根签发，直到运维显式轮换 nodes CA（删目录重启）。
    map $ssl_client_i_dn $client_class_raw {
        "~*CN=kurrent-ca-users" human;
        "~*CN=kurrent-ca-nodes" component;
        "~*CN=kurrent-ca(,|/|$)" component;
        default                 "";
    }
    map $ssl_client_verify $valid_client_class {
        "SUCCESS" $client_class_raw;
        default   "";
    }

    # ============================================================
    # HTTP 入口：301 重定向到 HTTPS（443 唯一对外入口，2026-09-15）
    #   全功能（WebUI/API/浏览/文件/引导链）均收敛到 443 块
    # ============================================================
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ============================================================
    # HTTPS 引导链入口（iPXE TOFU 信任锚，端口 443）
    #   - 自签证书由控制面启动时自动生成（control_plane/state/certs，TOFU pin 叶证书指纹，CA 层级已消解）
    #   - TLS 1.2 是 iPXE mbedTLS 的上限；同时提供 1.3（浏览器/CLI 走 1.3，
    #     只支持 1.2 的客户端仍协商 1.2，不改变引导链兼容性）
    #   - TOFU 单锚：全部 HTTPS 目标共享本证书——引导链端点、/file/ 资产、/tftp/ 菜单
    # ============================================================
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:AES128-GCM-SHA256;
        ssl_prefer_server_ciphers on;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy no-referrer always;

        # ── 组件证书轮换 mTLS ──
        # nginx 限制：ssl_verify_client 仅允许 http/server 上下文（ticket #400），
        # 故 server 级设为 optional（握手请求客户端证书但不强制，iPXE/浏览器无证书可连），
        # 在 renew location 用 $ssl_client_verify 强制必须 SUCCESS。
        ssl_verify_client optional;
        # 客户端证书信任包 = ca-users + ca-nodes（control 域不进 443）
        ssl_client_certificate /etc/nginx/pki/ca-bundle.pem;
        ssl_verify_depth 1;
        # 客户端证书吊销表 = users CRL + nodes CRL（拼接；缺省空表）。
        # 控制面吊销后重签并 reload，已吊销证书在下一次握手即被拒绝。
        ssl_crl /etc/nginx/pki/clients.crl;

        # 默认拒绝：未显式注入身份头的反代 location 一律发送空值。
        # 注意 nginx 的 proxy_set_header 继承规则——location 内只要定义了任一
        # proxy_set_header，server 级就不再继承，因此每个反代 location 必须显式
        # include snippets/proxy-identity-*.conf（静态测试会检查）。
        proxy_set_header X-Client-Cert-DN "";
        proxy_set_header X-Client-Cert-Issuer "";
        proxy_set_header X-Client-Cert-Serial "";
        proxy_set_header X-Client-Cert-Fingerprint "";
        proxy_set_header X-Client-Class "";
        proxy_set_header X-Client-Cert-Verify "";
        proxy_set_header X-Client-Cert-Raw-Issuer "";

        # ── Web UI (React SPA) + 文件浏览（443 唯一入口，2026-09-15 自 80 块迁移）──
        #   try_files 回退 index.html（SPA 路由由 HashRouter 接管）
        #   error_page 404 仅作用于本 location，不影响 /file/ 等下游
        root /usr/share/nginx/html;

        location / {
            try_files $uri $uri/ /index.html;
            error_page 404 /index.html;
        }

        # ── 引导链与健康检查：仅这几个端点，逐条精确匹配 ──
        # 不得使用 /devices/ 前缀透传：管理写接口会随前缀一起暴露，且客户端自带的
        # 身份头会被原样转发。每个 location 显式 include identity-none。
        # /devices/rotate 是写端点但凭旧密钥签名自证，不经管理面身份。
        location = /healthz {
            include snippets/proxy-identity-none.conf;
            proxy_pass http://control_plane;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 5s;
            proxy_connect_timeout 2s;
        }
        location = /boot-vars {
            include snippets/proxy-identity-none.conf;
            proxy_pass http://control_plane;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
        }
        location = /devices/report {
            include snippets/proxy-identity-none.conf;
            proxy_pass http://control_plane;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
        }
        location = /devices/challenge {
            include snippets/proxy-identity-none.conf;
            proxy_pass http://control_plane;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
        }
        # 设备密钥轮换：凭旧密钥签名（rotate||mac||new_pubkey||nonce），无证书、无 token
        location = /devices/rotate {
            include snippets/proxy-identity-none.conf;
            proxy_pass http://control_plane;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 10s;
            proxy_connect_timeout 5s;
        }
        # 引导链之外的 /devices/*（import/delete/bind/list 等）一律不对外暴露
        location ^~ /devices/ {
            return 404;
        }

        # ── 控制面 API（组件 PKI 引导/轮换 + 管理面认证）──
        # 剥离 /api/cp/ 前缀转发到控制面（唯一入口：WebUI/CLI HTTPS）。
        # 身份头只在链校验 SUCCESS 时注入，并同时带上 issuer/serial/fingerprint
        # 供控制面做主体类判断与审计（P2 启用）；无证书请求三个头为空。
        location /api/cp/ {
            # 组件证书只能走 renew；管理面只接受 users 域（human）与无证书请求（401）
            if ($valid_client_class = "component") { return 403; }
            include snippets/proxy-identity-client.conf;
            proxy_pass http://control_plane/;
            # 管理面响应含设备/会话/凭据台账：禁止浏览器与中间缓存留存。
            # location 内出现 add_header 会取消 server 级继承，故安全头一并重列。
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Referrer-Policy no-referrer always;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── 证书轮换端点（mTLS）：强制客户端证书（内部 CA 签发）──
        # 校验通过后注入 DN/issuer/serial/fingerprint，控制面再做 CN 在册匹配
        location = /api/cp/enroll/renew {
            if ($ssl_client_verify != "SUCCESS") { return 401; }
            # 只有 nodes 域（component）可续期；human 证书到此为止
            if ($valid_client_class != "component") { return 403; }
            include snippets/proxy-identity-client.conf;
            proxy_pass http://control_plane/enroll/renew;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── iPXE 资产下载（ISO / kernel / initrd，映射 public/）──
        # disable_symlinks：目录由宿主机维护，但归档解包可能带入符号链接；
        # 不跟随即无法借 /file/ 读到容器内其它路径（如 /etc/nginx/certs/server.key）
        location /file/ {
            alias /data/;
            disable_symlinks on from=/data;
            error_page 404 = @file_404;
        }
        location @file_404 {
            default_type text/plain;
            return 404 'not found';
        }

        # ── iPXE 菜单与覆盖脚本（映射宿主机 tftp/，与 TFTP 同源）──
        location /tftp/ {
            alias /tftp/;
            disable_symlinks on from=/tftp;
        }

    }
}
