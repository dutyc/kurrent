worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# Load njs module
load_module modules/ngx_http_js_module.so;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;

    # njs
    js_path "/etc/nginx/njs/";
    js_import file_list from file-list.js;

    # upstream ── 指向控制面容器（同一 compose 网络，服务名解析；4839 仅宿主回环，不另开）
    upstream control_plane {
        server kurrent-control-plane:8080;
    }

    # 客户端证书 DN：仅在链校验通过（SUCCESS）时透传（防无效证书伪造身份头）
    map $ssl_client_verify $valid_client_dn {
        "SUCCESS" $ssl_client_s_dn;
        default   "";
    }

    # ============================================================
    # HTTP 入口：301 重定向到 HTTPS（443 唯一对外入口，2026-09-15）
    #   全功能（WebUI/API/浏览/文件/引导链）均收敛到 443 块
    # ============================================================
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ============================================================
    # HTTPS 引导链入口（iPXE TOFU 信任锚，端口 443）
    #   - 自签证书由控制面启动时自动生成（control_plane/state/certs，TOFU pin 叶证书指纹，CA 层级已消解）
    #   - TLS ≤ 1.2（iPXE mbedTLS 封顶，固件 TLS 版本兼容性约束）
    #   - TOFU 单锚：全部 HTTPS 目标共享本证书——引导链端点、/file/ 资产、/tftp/ 菜单
    # ============================================================
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:AES128-GCM-SHA256;
        ssl_prefer_server_ciphers on;

        # ── 组件证书轮换 mTLS ──
        # nginx 限制：ssl_verify_client 仅允许 http/server 上下文（ticket #400），
        # 故 server 级设为 optional（握手请求客户端证书但不强制，iPXE/浏览器无证书可连），
        # 在 renew location 用 $ssl_client_verify 强制必须 SUCCESS。
        ssl_verify_client optional;
        ssl_client_certificate /etc/nginx/pki/ca.crt;
        ssl_verify_depth 1;

        # ── Web UI (React SPA) + 文件浏览（443 唯一入口，2026-09-15 自 80 块迁移）──
        #   try_files 回退 index.html（SPA 路由由 HashRouter 接管）
        #   error_page 404 仅作用于本 location，不影响 /file/ 等下游
        root /usr/share/nginx/html;

        location / {
            try_files $uri $uri/ /index.html;
            error_page 404 /index.html;
        }

        # ── File Browser（浏览页 + njs 目录列表 API）──
        location /browse/ {
            alias /usr/share/nginx/browse/;
            try_files $uri /browse/index.html;
        }
        location /api/browse/ {
            js_content file_list.directoryList;
        }

        # ── iPXE 引导链端点（report / challenge / boot-vars）→ control_plane:4839 ──
        # 裸路径原样转发（不带 URI 重写）：/devices/report、/devices/challenge、/boot-vars
        location ~ ^/(devices/|boot-vars) {
            proxy_pass http://control_plane;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
        }

        # ── 控制面 API（组件 PKI 引导/轮换 + 管理面认证，2026-09-15）──
        # 剥离 /api/cp/ 前缀转发到 control_plane（唯一入口：WebUI/CLI HTTPS）
        # 客户端证书 DN 透传（仅校验 SUCCESS 时非空）：控制面认证器链据此识别
        # 管理证书身份；无证书请求不发送该头（链上继续尝试 Bearer / 会话 Cookie）
        location /api/cp/ {
            proxy_pass http://control_plane/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Client-Cert-DN $valid_client_dn;
        }

        # ── 证书轮换端点（mTLS）：强制客户端证书（内部 CA 签发）──
        # 校验通过后把客户端证书 DN 透传给控制面（X-Client-Cert-DN），控制面再做
        # CN 在册匹配（防任何 CA 签发证书滥用；nginx 只校验链，业务层校验身份）
        location = /api/cp/enroll/renew {
            if ($ssl_client_verify != "SUCCESS") { return 401; }
            proxy_pass http://control_plane/enroll/renew;
            proxy_set_header Host $host;
            proxy_set_header X-Client-Cert-DN $ssl_client_s_dn;
        }

        # ── iPXE 资产下载（ISO / kernel / initrd，映射 public/）──
        location /file/ {
            alias /data/;
            error_page 404 = @file_404;
        }
        location @file_404 {
            default_type text/plain;
            return 404 'not found';
        }

        # ── iPXE 菜单与覆盖脚本（映射宿主机 tftp/，与 TFTP 同源）──
        location /tftp/ {
            alias /tftp/;
        }

    }
}
