<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 780" width="1100" height="780" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">Kurrent architecture</title>
  <desc id="arch-desc">Control plane, storage nodes, and devices. Management runs over 443 and a unix socket; the data plane runs NVMe/TCP TLS 1.3 on port 4421 and never crosses the control plane.</desc>
  <rect width="1100" height="780" fill="#faf9f6"/>

  <g font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
    <!-- Controller node -->
    <rect x="40" y="30" width="1020" height="240" rx="14" fill="#f6f9fd" stroke="#5b87b5" stroke-width="1.5"/>
    <text x="64" y="62" font-size="17" font-weight="600" fill="#2f4f70">Controller Node</text>
    <text x="64" y="82" font-size="12" fill="#6b7c8f">single host · management entry</text>

    <g>
      <rect x="64" y="96" width="140" height="44" rx="8" fill="#ffffff" stroke="#c6d3e0"/>
      <text x="134" y="122" font-size="13" text-anchor="middle" fill="#2f4f70">WebUI</text>
      <rect x="220" y="96" width="140" height="44" rx="8" fill="#ffffff" stroke="#c6d3e0"/>
      <text x="290" y="122" font-size="13" text-anchor="middle" fill="#2f4f70">CLI</text>
      <rect x="376" y="96" width="160" height="44" rx="8" fill="#ffffff" stroke="#c6d3e0"/>
      <text x="456" y="122" font-size="13" text-anchor="middle" fill="#2f4f70">other clients</text>
    </g>

    <rect x="660" y="88" width="360" height="60" rx="9" fill="#ffffff" stroke="#5b87b5"/>
    <text x="680" y="112" font-size="14" font-weight="600" fill="#2f4f70">nginx · :443</text>
    <text x="680" y="132" font-size="12" fill="#6b7c8f">唯一外部入口 · mTLS / token / session</text>

    <rect x="660" y="168" width="360" height="70" rx="9" fill="#ffffff" stroke="#5b87b5"/>
    <text x="680" y="192" font-size="14" font-weight="600" fill="#2f4f70">Control Plane</text>
    <text x="680" y="212" font-size="12" fill="#6b7c8f">unix socket · no management TCP port</text>
    <text x="680" y="228" font-size="11" fill="#8798aa">identity · ledger · scheduling · audit</text>

    <rect x="64" y="168" width="220" height="70" rx="9" fill="#ffffff" stroke="#5b87b5"/>
    <text x="84" y="192" font-size="14" font-weight="600" fill="#2f4f70">dnsmasq</text>
    <text x="84" y="212" font-size="12" fill="#6b7c8f">DHCP 67 · TFTP 69</text>
    <text x="84" y="228" font-size="11" fill="#8798aa">dnsmasq.conf is generated</text>

    <line x1="536" y1="118" x2="660" y2="118" stroke="#7a8ea3" stroke-width="1.5" marker-end="url(#arrow-mgmt)"/>
    <text x="560" y="110" font-size="11" fill="#6b7c8f">HTTPS</text>
    <line x1="840" y1="148" x2="840" y2="168" stroke="#7a8ea3" stroke-width="1.5" marker-end="url(#arrow-mgmt)"/>
    <line x1="660" y1="203" x2="284" y2="203" stroke="#7a8ea3" stroke-width="1.5" marker-end="url(#arrow-mgmt)"/>
    <text x="392" y="195" font-size="11" fill="#6b7c8f">dnsmasq.conf</text>

    <!-- Storage nodes -->
    <g>
      <rect x="40" y="330" width="500" height="190" rx="14" fill="#f7fbf8" stroke="#4f8f63" stroke-width="1.5"/>
      <text x="64" y="362" font-size="17" font-weight="600" fill="#2f5d3f">Storage Node 01</text>
      <text x="64" y="382" font-size="12" fill="#6b8476">data plane</text>

      <rect x="62" y="396" width="220" height="70" rx="9" fill="#ffffff" stroke="#4f8f63"/>
      <text x="82" y="420" font-size="14" font-weight="600" fill="#2f5d3f">storager-agent</text>
      <text x="82" y="440" font-size="12" fill="#6b8476">:4840 mTLS</text>
      <text x="82" y="456" font-size="11" fill="#7f9a8b">disks · masters · push</text>

      <rect x="310" y="396" width="210" height="70" rx="9" fill="#ffffff" stroke="#4f8f63"/>
      <text x="330" y="420" font-size="14" font-weight="600" fill="#2f5d3f">nvmet-host</text>
      <text x="330" y="440" font-size="12" fill="#6b8476">shared-volume UDS · mTLS</text>
      <text x="330" y="456" font-size="11" fill="#7f9a8b">configfs · DHHC-1</text>

      <rect x="62" y="484" width="458" height="20" rx="9" fill="#eef6f0" stroke="#4f8f63"/>
      <text x="291" y="499" font-size="12" text-anchor="middle" fill="#2f5d3f">kernel nvmet · NVMe/TCP · :4421 · TLS 1.3</text>

      <line x1="282" y1="431" x2="310" y2="431" stroke="#4f8f63" stroke-width="1.5" marker-end="url(#arrow-data)"/>
      <line x1="415" y1="466" x2="415" y2="484" stroke="#4f8f63" stroke-width="1.5" marker-end="url(#arrow-data)"/>
    </g>

    <g>
      <rect x="560" y="330" width="500" height="190" rx="14" fill="#f7fbf8" stroke="#4f8f63" stroke-width="1.5"/>
      <text x="584" y="362" font-size="17" font-weight="600" fill="#2f5d3f">Storage Node 02</text>
      <text x="584" y="382" font-size="12" fill="#6b8476">data plane</text>

      <rect x="582" y="396" width="220" height="70" rx="9" fill="#ffffff" stroke="#4f8f63"/>
      <text x="602" y="420" font-size="14" font-weight="600" fill="#2f5d3f">storager-agent</text>
      <text x="602" y="440" font-size="12" fill="#6b8476">:4840 mTLS</text>
      <text x="602" y="456" font-size="11" fill="#7f9a8b">disks · masters · push</text>

      <rect x="830" y="396" width="210" height="70" rx="9" fill="#ffffff" stroke="#4f8f63"/>
      <text x="850" y="420" font-size="14" font-weight="600" fill="#2f5d3f">nvmet-host</text>
      <text x="850" y="440" font-size="12" fill="#6b8476">shared-volume UDS · mTLS</text>
      <text x="850" y="456" font-size="11" fill="#7f9a8b">configfs · DHHC-1</text>

      <rect x="582" y="484" width="458" height="20" rx="9" fill="#eef6f0" stroke="#4f8f63"/>
      <text x="811" y="499" font-size="12" text-anchor="middle" fill="#2f5d3f">kernel nvmet · NVMe/TCP · :4421 · TLS 1.3</text>

      <line x1="802" y1="431" x2="830" y2="431" stroke="#4f8f63" stroke-width="1.5" marker-end="url(#arrow-data)"/>
      <line x1="935" y1="466" x2="935" y2="484" stroke="#4f8f63" stroke-width="1.5" marker-end="url(#arrow-data)"/>
    </g>

    <!-- Management arrows: control plane -> agents -->
    <path d="M 700 238 L 700 300 L 172 300 L 172 396" fill="none" stroke="#7a8ea3" stroke-width="1.5" marker-end="url(#arrow-mgmt)"/>
    <text x="410" y="292" font-size="11" fill="#6b7c8f">mTLS :4840</text>
    <path d="M 980 238 L 980 300 L 692 300 L 692 396" fill="none" stroke="#7a8ea3" stroke-width="1.5" marker-end="url(#arrow-mgmt)"/>

    <!-- Boot path: devices -> dnsmasq / nginx -->
    <path d="M 550 600 L 550 290 L 174 290 L 174 238" fill="none" stroke="#b07a2a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-boot)"/>
    <text x="196" y="282" font-size="11" fill="#94651f">PXE boot · DHCP → TFTP → HTTPS</text>

    <!-- Devices -->
    <g>
      <rect x="40" y="600" width="300" height="100" rx="12" fill="#fbfcfe" stroke="#5b87b5" stroke-width="1.5"/>
      <text x="64" y="630" font-size="15" font-weight="600" fill="#2f4f70">Device 01</text>
      <text x="64" y="652" font-size="12" fill="#6b7c8f">Worker worker-01</text>
      <text x="64" y="676" font-size="11" fill="#8798aa">iPXE · NVRAM identity · TOFU</text>

      <rect x="380" y="600" width="300" height="100" rx="12" fill="#fbfcfe" stroke="#5b87b5" stroke-width="1.5"/>
      <text x="404" y="630" font-size="15" font-weight="600" fill="#2f4f70">Device 02</text>
      <text x="404" y="652" font-size="12" fill="#6b7c8f">Worker worker-02</text>
      <text x="404" y="676" font-size="11" fill="#8798aa">iPXE · NVRAM identity · TOFU</text>

      <rect x="720" y="600" width="300" height="100" rx="12" fill="#fbfcfe" stroke="#5b87b5" stroke-width="1.5"/>
      <text x="744" y="630" font-size="15" font-weight="600" fill="#2f4f70">Device 03</text>
      <text x="744" y="652" font-size="12" fill="#6b7c8f">Worker worker-03</text>
      <text x="744" y="676" font-size="11" fill="#8798aa">iPXE · NVRAM identity · TOFU</text>
    </g>

    <!-- Data plane arrows -->
    <line x1="120" y1="600" x2="120" y2="504" stroke="#4f8f63" stroke-width="2" marker-end="url(#arrow-data)"/>
    <text x="132" y="576" font-size="11" fill="#2f5d3f">NVMe/TCP · TLS 1.3</text>
    <line x1="1000" y1="600" x2="1000" y2="504" stroke="#4f8f63" stroke-width="2" marker-end="url(#arrow-data)"/>
    <text x="812" y="576" font-size="11" fill="#2f5d3f">NVMe/TCP · TLS 1.3</text>

    <text x="40" y="742" font-size="12" fill="#6b7c8f">Data plane never crosses the control plane. A control-plane failure affects provisioning and boot, not established I/O.</text>
    <text x="40" y="762" font-size="11" fill="#8798aa">The control plane listens on a unix socket only; nginx is the sole external HTTPS entry.</text>
  </g>

  <defs>
    <marker id="arrow-mgmt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a8ea3"/>
    </marker>
    <marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f8f63"/>
    </marker>
    <marker id="arrow-boot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b07a2a"/>
    </marker>
  </defs>
</svg>
