<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-labelledby="storage-title storage-desc">
  <title id="storage-title">Storage path from master image to device</title>
  <desc id="storage-desc">The control plane places and audits storage but never carries block I/O. An Agent clones a master image into a system disk, registers the target through nvmet-host, and the device reaches the kernel nvmet target directly over NVMe/TCP TLS 1.3 on port 4421.</desc>
  <rect width="1200" height="620" fill="#faf9f6"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#6f6a61"/>
    </marker>
    <marker id="arrow-start" markerWidth="8" markerHeight="8" refX="1" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M8,0 L8,6 L0,3 z" fill="#6f6a61"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#8a3f2b"/>
    </marker>
    <marker id="arrow-accent-start" markerWidth="8" markerHeight="8" refX="1" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M8,0 L8,6 L0,3 z" fill="#8a3f2b"/>
    </marker>
  </defs>

  <g font-family="Inter, 'Noto Sans CJK SC', 'Segoe UI', sans-serif">
    <text x="48" y="42" font-size="10" letter-spacing="2.4" fill="#8a3f2b">STORAGE PATH</text>
    <text x="48" y="72" font-family="Georgia, 'Noto Serif CJK SC', serif" font-size="24" fill="#151412">From master image to running system</text>
    <line x1="48" y1="88" x2="1152" y2="88" stroke="#d8d1c5"/>

    <text x="48" y="108" font-size="9" letter-spacing="1.8" fill="#8d867b">CONTROL PATH</text>

    <rect x="48" y="120" width="230" height="140" rx="8" fill="#f4f1ea" stroke="#c9c2b6"/>
    <text x="68" y="148" font-size="13" font-weight="600" fill="#151412">Control Plane</text>
    <text x="68" y="170" font-size="11" fill="#6f6a61">placement</text>
    <text x="68" y="188" font-size="11" fill="#6f6a61">credential issue</text>
    <text x="68" y="206" font-size="11" fill="#6f6a61">audit</text>
    <text x="68" y="238" font-size="10" fill="#8d867b">no block I/O</text>

    <rect x="318" y="120" width="250" height="140" rx="8" fill="#f4f1ea" stroke="#c9c2b6"/>
    <text x="338" y="148" font-size="13" font-weight="600" fill="#151412">Agent · :4840</text>
    <text x="338" y="170" font-size="11" fill="#6f6a61">clone · delete · scan</text>
    <text x="338" y="188" font-size="11" fill="#6f6a61">mTLS · disk lifecycle</text>
    <text x="338" y="220" font-size="10" fill="#8d867b">master cache</text>
    <text x="338" y="238" font-size="10" fill="#8d867b">placement-aware</text>

    <rect x="608" y="120" width="250" height="140" rx="8" fill="#f4f1ea" stroke="#c9c2b6"/>
    <text x="628" y="148" font-size="13" font-weight="600" fill="#151412">nvmet-host</text>
    <text x="628" y="170" font-size="11" fill="#6f6a61">shared-volume UDS</text>
    <text x="628" y="188" font-size="11" fill="#6f6a61">configfs · DHHC-1</text>
    <text x="628" y="220" font-size="10" fill="#8d867b">allowed_hosts</text>
    <text x="628" y="238" font-size="10" fill="#8d867b">keyring injection</text>

    <rect x="898" y="120" width="254" height="140" rx="8" fill="none" stroke="#a8a197" stroke-dasharray="4 4"/>
    <text x="914" y="148" font-size="10" font-weight="600" fill="#6f6a61">TLS PSK</text>
    <text x="914" y="172" font-size="10" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" fill="#6f6a61">HMAC-SHA256(</text>
    <text x="914" y="190" font-size="10" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" fill="#6f6a61">raw DHHC-1 key,</text>
    <text x="914" y="208" font-size="10" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" fill="#6f6a61">"kurrent-nvme-tls-psk-v1")</text>

    <line x1="278" y1="190" x2="318" y2="190" stroke="#6f6a61" stroke-width="1.4" marker-end="url(#arrow)"/>
    <line x1="568" y1="190" x2="608" y2="190" stroke="#6f6a61" stroke-width="1.4" marker-end="url(#arrow)"/>

    <text x="48" y="330" font-size="9" letter-spacing="1.8" fill="#8d867b">DATA PATH</text>

    <rect x="48" y="342" width="230" height="150" rx="8" fill="#f4f1ea" stroke="#c9c2b6"/>
    <text x="68" y="370" font-size="13" font-weight="600" fill="#151412">Master image</text>
    <text x="68" y="392" font-size="11" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" fill="#6f6a61">_tpl_ubuntu2604.img</text>
    <text x="68" y="416" font-size="11" fill="#6f6a61">read-only clone source</text>
    <text x="68" y="434" font-size="10" fill="#8d867b">4K native GPT required</text>

    <rect x="318" y="342" width="250" height="150" rx="8" fill="#f7efe9" stroke="#8a3f2b"/>
    <text x="338" y="370" font-size="13" font-weight="600" fill="#151412">System disk</text>
    <text x="338" y="392" font-size="10" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" fill="#6f6a61">&lt;worker&gt;.&lt;os&gt;.&lt;tag&gt;.img</text>
    <text x="338" y="416" font-size="11" fill="#6f6a61">NQN is the disk identity</text>
    <text x="338" y="434" font-size="10" fill="#8d867b">default_disk selects boot</text>

    <rect x="608" y="342" width="250" height="150" rx="8" fill="#f7efe9" stroke="#8a3f2b"/>
    <text x="628" y="370" font-size="13" font-weight="600" fill="#151412">kernel nvmet · :4421</text>
    <text x="628" y="392" font-size="11" fill="#6f6a61">NVMe/TCP target</text>
    <text x="628" y="410" font-size="11" fill="#6f6a61">TLS 1.3 required</text>
    <text x="628" y="434" font-size="10" fill="#8d867b">no plaintext fallback</text>

    <rect x="898" y="342" width="254" height="150" rx="8" fill="#faf9f6" stroke="#c9c2b6"/>
    <text x="918" y="370" font-size="13" font-weight="600" fill="#151412">Device</text>
    <text x="918" y="392" font-size="11" fill="#6f6a61">firmware sanboot</text>
    <text x="918" y="410" font-size="11" fill="#6f6a61">kernel reconnect</text>
    <text x="918" y="434" font-size="10" fill="#8d867b">one data-plane port</text>

    <line x1="278" y1="417" x2="318" y2="417" stroke="#6f6a61" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="298" y="409" font-size="9" text-anchor="middle" fill="#6f6a61">clone</text>
    <line x1="443" y1="260" x2="443" y2="342" stroke="#6f6a61" stroke-width="1.4" marker-start="url(#arrow-start)" marker-end="url(#arrow)"/>
    <text x="451" y="304" font-size="9" fill="#6f6a61">create · delete</text>
    <line x1="733" y1="260" x2="733" y2="342" stroke="#6f6a61" stroke-width="1.4" marker-start="url(#arrow-start)" marker-end="url(#arrow)"/>
    <text x="741" y="304" font-size="9" fill="#6f6a61">PSK → keyring</text>
    <line x1="568" y1="342" x2="608" y2="260" stroke="#6f6a61" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="584" y="306" font-size="9" fill="#6f6a61">export</text>

    <line x1="858" y1="417" x2="898" y2="417" stroke="#8a3f2b" stroke-width="1.7" marker-start="url(#arrow-accent-start)" marker-end="url(#arrow-accent)"/>
    <text x="878" y="516" font-size="9" text-anchor="middle" fill="#8a3f2b">NVMe/TCP 4421 · TLS 1.3</text>

    <text x="48" y="560" font-size="10" fill="#8d867b">The control plane places and audits; it never carries block I/O. Credentials follow the Worker, not the disk file.</text>
  </g>
</svg>
