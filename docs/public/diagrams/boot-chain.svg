<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="boot-title boot-desc">
  <title id="boot-title">Kurrent boot chain</title>
  <desc id="boot-desc">One boot crosses three boundaries: a plaintext DHCP/TFTP first hop, an HTTPS identity and admission exchange between the device and the control plane, and an NVMe/TCP TLS 1.3 data-plane connection between the device and the storage node.</desc>
  <rect width="1200" height="700" fill="#faf9f6"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#6f6a61"/>
    </marker>
    <marker id="arrow-start" markerWidth="8" markerHeight="8" refX="1" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M8,0 L8,6 L0,3 z" fill="#6f6a61"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#8a3f2b"/>
    </marker>
    <marker id="arrow-accent-start" markerWidth="8" markerHeight="8" refX="1" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M8,0 L8,6 L0,3 z" fill="#8a3f2b"/>
    </marker>
  </defs>

  <g font-family="Inter, 'Noto Sans CJK SC', 'Segoe UI', sans-serif">
    <text x="48" y="42" font-size="10" letter-spacing="2.4" fill="#8a3f2b">BOOT CHAIN</text>
    <text x="48" y="72" font-family="Georgia, 'Noto Serif CJK SC', serif" font-size="24" fill="#151412">One boot, three boundaries</text>
    <line x1="48" y1="88" x2="1152" y2="88" stroke="#d8d1c5"/>

    <line x1="176" y1="108" x2="176" y2="658" stroke="#e2dcd1" stroke-dasharray="3 5"/>

    <text x="48" y="152" font-family="Georgia, 'Noto Serif CJK SC', serif" font-size="22" fill="#151412">01</text>
    <text x="48" y="172" font-size="9" letter-spacing="1.8" fill="#8d867b">FIRST HOP</text>

    <rect x="190" y="108" width="962" height="100" rx="10" fill="#f4f1ea" stroke="#d8d1c5"/>
    <rect x="214" y="126" width="220" height="64" rx="7" fill="#faf9f6" stroke="#c9c2b6"/>
    <text x="230" y="151" font-size="13" font-weight="600" fill="#151412">Device</text>
    <text x="230" y="170" font-size="11" fill="#6f6a61">iPXE · network boot</text>

    <rect x="520" y="126" width="220" height="64" rx="7" fill="#faf9f6" stroke="#c9c2b6"/>
    <text x="536" y="151" font-size="13" font-weight="600" fill="#151412">dnsmasq</text>
    <text x="536" y="170" font-size="11" fill="#6f6a61">DHCP 67 · TFTP 69</text>

    <rect x="790" y="126" width="338" height="64" rx="7" fill="none" stroke="#a8a197" stroke-dasharray="4 4"/>
    <text x="806" y="151" font-size="10" font-weight="600" fill="#6f6a61">PLAINTEXT FIRST HOP</text>
    <text x="806" y="171" font-size="10" fill="#6f6a61">Isolate the PXE network; no cryptographic protection.</text>

    <line x1="434" y1="158" x2="520" y2="158" stroke="#6f6a61" stroke-width="1.4" marker-start="url(#arrow-start)" marker-end="url(#arrow)"/>
    <text x="477" y="149" font-size="9" text-anchor="middle" fill="#6f6a61">DHCP / TFTP</text>

    <text x="48" y="352" font-family="Georgia, 'Noto Serif CJK SC', serif" font-size="22" fill="#151412">02</text>
    <text x="48" y="372" font-size="9" letter-spacing="1.8" fill="#8d867b">IDENTITY</text>

    <rect x="190" y="288" width="962" height="180" rx="10" fill="#f4f1ea" stroke="#d8d1c5"/>
    <rect x="214" y="320" width="220" height="80" rx="7" fill="#faf9f6" stroke="#c9c2b6"/>
    <text x="230" y="348" font-size="13" font-weight="600" fill="#151412">Device</text>
    <text x="230" y="368" font-size="11" fill="#6f6a61">iPXE + device key</text>
    <text x="230" y="386" font-size="10" fill="#8d867b">ECDSA P-256 in NVRAM</text>

    <rect x="520" y="300" width="608" height="150" rx="7" fill="#faf9f6" stroke="#c9c2b6"/>
    <text x="540" y="326" font-size="13" font-weight="600" fill="#151412">Control plane · HTTPS 443</text>
    <text x="540" y="344" font-size="10" fill="#8d867b">TOFU · one-shot nonce · admission</text>

    <rect x="540" y="360" width="126" height="32" rx="5" fill="#f4f1ea" stroke="#d8d1c5"/>
    <text x="603" y="380" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" fill="#151412">/devices/report</text>
    <rect x="680" y="360" width="148" height="32" rx="5" fill="#f4f1ea" stroke="#d8d1c5"/>
    <text x="754" y="380" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" fill="#151412">/devices/challenge</text>
    <rect x="842" y="360" width="130" height="32" rx="5" fill="#f4f1ea" stroke="#d8d1c5"/>
    <text x="907" y="380" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" fill="#151412">sign(nonce‖mac)</text>
    <rect x="986" y="360" width="122" height="32" rx="5" fill="#f4f1ea" stroke="#d8d1c5"/>
    <text x="1047" y="380" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" fill="#151412">/boot-vars</text>

    <text x="540" y="424" font-size="10" fill="#6f6a61">Admission requires the bound device, a valid signature, and a ready credential path.</text>

    <line x1="434" y1="360" x2="520" y2="360" stroke="#6f6a61" stroke-width="1.4" marker-start="url(#arrow-start)" marker-end="url(#arrow)"/>
    <text x="477" y="351" font-size="9" text-anchor="middle" fill="#6f6a61">HTTPS</text>

    <text x="48" y="562" font-family="Georgia, 'Noto Serif CJK SC', serif" font-size="22" fill="#151412">03</text>
    <text x="48" y="582" font-size="9" letter-spacing="1.8" fill="#8d867b">DATA PLANE</text>

    <rect x="190" y="498" width="962" height="160" rx="10" fill="#f4f1ea" stroke="#d8d1c5"/>
    <rect x="214" y="520" width="220" height="110" rx="7" fill="#faf9f6" stroke="#c9c2b6"/>
    <text x="230" y="548" font-size="13" font-weight="600" fill="#151412">Device</text>
    <text x="230" y="568" font-size="11" fill="#6f6a61">sanboot</text>
    <text x="230" y="586" font-size="10" fill="#8d867b">firmware → initramfs</text>

    <rect x="520" y="520" width="608" height="110" rx="7" fill="#f7efe9" stroke="#8a3f2b"/>
    <text x="540" y="548" font-size="13" font-weight="600" fill="#151412">Storage node · NVMe/TCP target :4421</text>
    <text x="540" y="568" font-size="11" fill="#6f6a61">system disk NQN · DH-HMAC-CHAP + TLS 1.3</text>
    <text x="540" y="590" font-size="10" fill="#8d867b">after boot: NBFT / NBCT → kernel reconnect → rootfs → login</text>

    <line x1="434" y1="575" x2="520" y2="575" stroke="#8a3f2b" stroke-width="1.7" marker-start="url(#arrow-accent-start)" marker-end="url(#arrow-accent)"/>
    <text x="477" y="566" font-size="9" text-anchor="middle" fill="#8a3f2b">NVMe/TCP</text>
    <text x="477" y="596" font-size="9" text-anchor="middle" fill="#8a3f2b">TLS 1.3</text>

    <text x="48" y="682" font-size="10" fill="#8d867b">The control plane projects the answers for each boot; nothing is written into the machine or the disk.</text>
  </g>
</svg>
