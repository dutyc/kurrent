<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="entities-title entities-desc">
  <title id="entities-title">Device, Worker and system disk</title>
  <desc id="entities-desc">Three independent entities: a Device identified by MAC with the device ledger as authority, a Worker identified by worker_id with the control-plane ledger as authority, and a system disk identified by NQN with the disk file as authority. A device binds to one Worker; a Worker owns one or more system disks.</desc>
  <rect width="1200" height="520" fill="#faf9f6"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#151412"/>
    </marker>
    <marker id="arrow-start" markerWidth="8" markerHeight="8" refX="1" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M8,0 L8,6 L0,3 z" fill="#151412"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#8a3f2b"/>
    </marker>
  </defs>

  <g font-family="Inter, 'Noto Sans CJK SC', 'Segoe UI', sans-serif">
    <text x="48" y="42" font-size="10" letter-spacing="2.4" fill="#8a3f2b">THREE ENTITIES</text>
    <text x="48" y="72" font-family="Georgia, 'Noto Serif CJK SC', serif" font-size="24" fill="#151412">Device, Worker, system disk</text>
    <line x1="48" y1="88" x2="1152" y2="88" stroke="#d8d1c5"/>

    <rect x="48" y="128" width="320" height="250" rx="12" fill="#f4f1ea" stroke="#d8d1c5"/>
    <text x="72" y="158" font-size="9" letter-spacing="2" fill="#8a3f2b">01 / DEVICE</text>
    <text x="72" y="192" font-family="Georgia, 'Noto Serif CJK SC', serif" font-size="20" fill="#151412">Device</text>
    <rect x="72" y="208" width="272" height="38" rx="6" fill="#faf9f6" stroke="#d8d1c5"/>
    <text x="86" y="232" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="11" fill="#151412">MAC · 00:0c:29:b9:8b:2d</text>
    <text x="72" y="274" font-size="11" fill="#6f6a61">authority · state/devices.yml</text>
    <text x="72" y="294" font-size="11" fill="#6f6a61">binding anchor · MAC</text>
    <text x="72" y="314" font-size="11" fill="#6f6a61">lifecycle · pooled → bound → revoked</text>
    <text x="72" y="346" font-size="10" fill="#8d867b">Registration is not authorization.</text>

    <rect x="440" y="128" width="320" height="250" rx="12" fill="#f4f1ea" stroke="#d8d1c5"/>
    <text x="464" y="158" font-size="9" letter-spacing="2" fill="#8a3f2b">02 / WORKER</text>
    <text x="464" y="192" font-family="Georgia, 'Noto Serif CJK SC', serif" font-size="20" fill="#151412">Worker</text>
    <rect x="464" y="208" width="272" height="38" rx="6" fill="#faf9f6" stroke="#d8d1c5"/>
    <text x="478" y="232" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="11" fill="#151412">worker_id · worker-01</text>
    <text x="464" y="274" font-size="11" fill="#6f6a61">authority · state/workers.yml</text>
    <text x="464" y="294" font-size="11" fill="#6f6a61">compute identity · hostname</text>
    <text x="464" y="314" font-size="11" fill="#6f6a61">rebind keeps the identity</text>
    <text x="464" y="346" font-size="10" fill="#8d867b">The machine can change; the Worker cannot.</text>

    <rect x="832" y="128" width="320" height="250" rx="12" fill="#f4f1ea" stroke="#d8d1c5"/>
    <text x="856" y="158" font-size="9" letter-spacing="2" fill="#8a3f2b">03 / SYSTEM DISK</text>
    <text x="856" y="192" font-family="Georgia, 'Noto Serif CJK SC', serif" font-size="20" fill="#151412">System disk</text>
    <rect x="856" y="208" width="272" height="38" rx="6" fill="#faf9f6" stroke="#d8d1c5"/>
    <text x="870" y="232" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="10" fill="#151412">NQN · …:worker-01.ubuntu.9b8a7c6d5e4f</text>
    <text x="856" y="274" font-size="11" fill="#6f6a61">authority · disk file + worker ledger</text>
    <text x="856" y="294" font-size="11" fill="#6f6a61">boot unit · NQN</text>
    <text x="856" y="314" font-size="11" fill="#6f6a61">default_disk chooses the boot disk</text>
    <text x="856" y="346" font-size="10" fill="#8d867b">The disk stays; the machine changes.</text>

    <line x1="368" y1="253" x2="440" y2="253" stroke="#151412" stroke-width="1.5" marker-start="url(#arrow-start)" marker-end="url(#arrow)"/>
    <text x="404" y="244" font-size="10" text-anchor="middle" fill="#151412">bind / rebind</text>
    <text x="404" y="272" font-size="9" text-anchor="middle" fill="#8d867b">one-to-one</text>

    <line x1="760" y1="253" x2="832" y2="253" stroke="#8a3f2b" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
    <text x="796" y="244" font-size="10" text-anchor="middle" fill="#8a3f2b">owns</text>
    <text x="796" y="272" font-size="9" text-anchor="middle" fill="#8d867b">one-to-many</text>

    <rect x="48" y="414" width="1104" height="64" rx="10" fill="#f4f1ea" stroke="#d8d1c5"/>
    <text x="72" y="452" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="13" fill="#151412">readiness = bound device + system disk</text>
    <text x="1128" y="452" font-size="11" text-anchor="end" fill="#6f6a61">A rebind moves the system to another machine; the disk does not move.</text>
  </g>
</svg>
